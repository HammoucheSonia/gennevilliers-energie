services:
  - type: web
    name: gennevilliers-energie-demo
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60 app:app
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: demonstration
      - key: PYTHON_VERSION
        value: 3.12.8
